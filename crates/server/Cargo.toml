[package]
name                  = "ncro-server"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
description.workspace = true
homepage.workspace    = true
repository.workspace  = true

[dependencies]
axum                   = { workspace = true, features = [ "macros" ] }
bytes.workspace        = true
futures-util.workspace = true
ncro-config.workspace  = true
ncro-db.workspace      = true
ncro-health.workspace  = true
ncro-metrics.workspace = true
ncro-narinfo.workspace = true
ncro-router.workspace  = true
ncro-s3.workspace      = true
reqwest                = { workspace = true, features = [ "rustls-no-provider", "stream" ] }
rustls.workspace       = true
serde                  = { workspace = true, features = [ "derive" ] }
tokio.workspace        = true
tower-http.workspace   = true
tracing.workspace      = true
url.workspace           = true

[dev-dependencies]
sha2  = "0.11.0"
tokio = { workspace = true, features = [ "macros", "rt-multi-thread", "net", "sync", "time" ] }

[lints]
workspace = true
