[server]
listen        = ":8080"
read_timeout  = "30s"
write_timeout = "30s"

[[upstreams]]
priority   = 10
url        = "https://cache.nixos.org"
public_key = "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
# Pull-through caches may need to accept multiple narinfo signers:
# public_keys = [
#   "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
#   "origin-cache-1:...",
# ]

# Try without a public key.
[[upstreams]]
priority = 20
url      = "https://nix-community.cachix.org"

# Optional per-upstream timeout overrides. When set, these override the global
# timeouts for this upstream only.
#
# nar_url_mode    = "keep" # keep | to_self | to_upstream
# narinfo_timeout = "10s"  # overrides the router's race timeout for narinfo
# nar_timeout     = "60s"  # overrides the server's read_timeout for NAR streams
# username        = "ncro"
# password_file   = "/run/secrets/ncro-upstream-password"

# Optional per-upstream filters. Deny rules always reject matching paths. If an
# upstream has any allow rules, at least one allow rule must match.
#
# [[upstreams.filters]]
# action  = "allow"      # allow | deny
# field   = "name"       # name | store_path | reference | deriver
# pattern = "zedless*"   # supports '*' wildcards

# Optional last-resort cache. Disabled by default. When enabled, this cache is
# used only when the normal upstream set is unavailable, and is not part of
# health probing, priority routing, discovery, filters, cooldown, or route DB
# persistence. URL, public_key/public_keys, username/password/password_file,
# and s3:// URLs are accepted like regular upstreams.
[fallback_cache]
enabled    = false
url        = "https://cache.nixos.org"
public_key = "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="

[cache]
db_path       = "/var/lib/ncro/routes.db"
latency_alpha = 0.3
max_entries   = 100000
negative_ttl  = "10m"
ttl           = "1h"

[cache.mass_query]
in_memory_negative_ttl    = "5s"
max_concurrent_races      = 64
per_upstream_max_inflight = 8
upstream_cooldown         = "15s"

[trust]
# off | signed | quorum. In signed mode, accepted narinfos must verify against
# one of the selected upstream's configured signer keys (`public_key` or
# `public_keys`). In quorum mode, at least threshold
# distinct configured signer keys must agree on StorePath, NarHash, NarSize,
# and References before ncro stores a route. See docs/trust.md for the full
# model.
fail_closed              = true
mode                     = "off"
require_distinct_signers = true
threshold                = 2

# Signer keys trusted to vouch for content in quorum mode, in addition to the
# keys configured on regular upstreams and an enabled fallback cache. A quorum
# counts only claims signed by a key in this set; without it an attacker could
# self-sign forged content under throwaway keys and forge agreement. In a mesh,
# list the other nodes' upstream signer keys here so their relayed claims count.
# trusted_keys           = ["cache-b-1:base64key=", "cache-c-1:base64key="]

[discovery]
discovery_time = "5s"
domain         = "local"
enabled        = false
priority       = 20
service_name   = "_nix-serve._tcp"

[mesh]
bind_addr       = "0.0.0.0:7946"
enabled         = false
gossip_interval = "30s"
peers           = [  ]
private_key     = "/etc/ncro/node.key"

# When true, this node gossips trust claims it has verified and accepts claims
# relayed by peers (each re-verified against its original Nix signer key before
# being trusted). Lets a quorum form across a mesh where each node sees only one
# upstream. Only meaningful with trust.mode = "quorum".
gossip_trust_claims = false

[logging]
format     = "json"
level      = "info" # tracing filter, e.g. "debug" or "ncro=debug,tower_http=warn"
timestamps = true
