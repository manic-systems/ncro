[server]
listen          = ":8080"
read_timeout    = "30s"
write_timeout   = "30s"
# Advertised to Nix in /nix-cache-info. `cache_priority` sets `Priority` (lower
# is preferred by Nix on ties); `want_mass_query` sets `WantMassQuery` (allow
# bulk .narinfo queries).
cache_priority  = 30
want_mass_query = true

[[upstreams]]
priority   = 10
public_key = "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
url        = "https://cache.nixos.org"
# Pull-through caches may need to accept multiple narinfo signers:
# public_keys = [
#   "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
#   "origin-cache-1:...",
# ]

# Try without a public key.
[[upstreams]]
priority = 20
url      = "https://nix-community.cachix.org"

# Optional per-upstream timeout overrides. When set, these override the global
# timeouts for this upstream only.
#
# nar_url_mode    = "keep" # keep | to_self | to_upstream
# narinfo_timeout = "10s"  # overrides the router's race timeout for narinfo
# nar_timeout     = "60s"  # overrides the server's read_timeout for NAR streams
# allow_hedging   = false  # do not launch this upstream as an additional NAR hedge
# username        = "ncro"
# password_file   = "/run/secrets/ncro-upstream-password"

# Optional per-upstream filters. Deny rules always reject matching paths. If an
# upstream has any allow rules, at least one allow rule must match.
#
# [[upstreams.filters]]
# action  = "allow"      # allow | deny
# field   = "name"       # name | store_path | reference | deriver
# pattern = "zedless*"   # supports '*' wildcards

# Optional last-resort cache. Disabled by default. When enabled, this cache is
# used only when the normal upstream set is unavailable, and is not part of
# health probing, priority routing, discovery, filters, cooldown, or route DB
# persistence. URL, public_key/public_keys, username/password/password_file,
# and s3:// URLs are accepted like regular upstreams.
[fallback_cache]
enabled    = false
public_key = "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
url        = "https://cache.nixos.org"

[cache]
db_path                  = "/var/lib/ncro/routes.db"
latency_alpha            = 0.3
max_entries              = 100000
negative_ttl             = "10m"
slow_statement_threshold = "5s"
ttl                      = "1h"

[cache.nar_hedging]
# Start another eligible source after this delay if no source has delivered a
# successful response and first body byte. `max_inflight = 1` disables overlap.
delay        = "1s"
enabled      = true
max_inflight = 2

[cache.mass_query]
in_memory_negative_ttl    = "5s"
max_concurrent_races      = 64
per_upstream_max_inflight = 8
upstream_cooldown         = "15s"

[discovery]
discovery_time = "5s"
domain         = "local"
enabled        = false
priority       = 20
service_name   = "_nix-serve._tcp"

[mesh]
bind_addr       = "0.0.0.0:7946"
enabled         = false
gossip_interval = "30s"
peers           = [  ]
private_key     = "/etc/ncro/node.key"

[logging]
format     = "json"
level      = "info" # tracing filter, e.g. "debug" or "ncro=debug,tower_http=warn"
timestamps = true
