name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      os: ubuntu-latest
      timeout-minutes: 30
      flake-check: false
      fmt: true
      fmt-command: cargo fmt --check
      clippy: true
      clippy-command: cargo clippy --all-targets -- -D warnings
      test: true
      test-command: cargo nextest run --all

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      os: ${{ matrix.os }}
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#ncro -L --no-link
      cache: true
      cache-save: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  vm-test:
    name: ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: P2P Discovery Test
            check: p2p-discovery
          - name: E2E Test
            check: e2e
          - name: S3 Test
            check: s3
          - name: Netrc Test
            check: netrc
          - name: Socket Activation Test
            check: socket-activation
          - name: Multi-Instance Test
            check: multi-instance
          - name: Public Keys Test
            check: public-keys
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
      cache: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
