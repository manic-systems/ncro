name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      os: ubuntu-latest
      timeout-minutes: 30
      flake-check: false
      fmt: true
      fmt-command: cargo fmt --check
      clippy: true
      clippy-command: cargo clippy --all-targets -- -D warnings
      test: true
      test-command: cargo nextest run --all

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      os: ${{ matrix.os }}
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#ncro -L --no-link
      cache: true
      cache-save: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  build-darwin:
    name: Build (aarch64-darwin)
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      os: macos-latest
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#ncro -L --no-link
      cache: true
      cache-save: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  darwin-module:
    name: nix-darwin Module (${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: unstable
            command: nix build .#checks.x86_64-linux.darwin-module -L --no-link
          - release: "26.05"
            command: |
              nix build --impure -L --no-link --expr '
                let
                  pkgs = import (fetchTarball "https://channels.nixos.org/nixos-26.05/nixexprs.tar.xz") {system = "x86_64-linux";};
                in
                  pkgs.callPackage ./nix/tests/darwin-module.nix {
                    self = builtins.getFlake (toString ./.);
                    nix-darwin = fetchTarball "https://github.com/nix-darwin/nix-darwin/archive/nix-darwin-26.05.tar.gz";
                  }
              '
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      timeout-minutes: 10
      flake-check: false
      build: true
      build-command: ${{ matrix.command }}

  vm-test:
    name: ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: P2P Discovery Test
            check: p2p-discovery
          - name: E2E Test
            check: e2e
          - name: S3 Test
            check: s3
          - name: Netrc Test
            check: netrc
          - name: Socket Activation Test
            check: socket-activation
          - name: Multi-Instance Test
            check: multi-instance
          - name: Public Keys Test
            check: public-keys
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
      cache: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - build
      - build-darwin
      - darwin-module
      - vm-test
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
