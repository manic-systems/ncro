name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      os: ubuntu-latest
      timeout-minutes: 30
      flake-check: false
      fmt: true
      fmt-command: cargo fmt --check
      clippy: true
      clippy-command: cargo clippy --all-targets -- -D warnings
      test: true
      test-command: cargo nextest run --all

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      os: ${{ matrix.os }}
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#ncro -L --no-link
      cache: true
      cache-save: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  build-darwin:
    name: Build (aarch64-darwin)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      - name: Restore and save cached paths
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ncro-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'ncro/**') }}
          restore-prefixes-first-match: |
            nix-ncro-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
            nix-ncro-${{ runner.os }}-${{ runner.arch }}-main-
          gc-max-store-size-macos: 8G
          purge: true
          purge-prefixes: nix-ncro-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never
      - name: Build ncro
        run: nix build .#ncro -L --no-link

  darwin-module:
    name: nix-darwin Module (${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        release: [unstable, "26.05"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      - name: Evaluate darwinSystem with services.ncro enabled
        if: matrix.release == 'unstable'
        run: nix build .#checks.x86_64-linux.darwin-module -L --no-link
      - name: Evaluate darwinSystem with services.ncro enabled
        if: matrix.release != 'unstable'
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          nix build --impure -L --no-link --expr "
            let
              pkgs = import (fetchTarball \"https://channels.nixos.org/nixos-$RELEASE/nixexprs.tar.xz\") {system = \"x86_64-linux\";};
            in
              pkgs.callPackage ./nix/tests/darwin-module.nix {
                self = builtins.getFlake (toString ./.);
                nix-darwin = fetchTarball \"https://github.com/nix-darwin/nix-darwin/archive/nix-darwin-$RELEASE.tar.gz\";
              }
          "

  vm-test:
    name: ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: P2P Discovery Test
            check: p2p-discovery
          - name: E2E Test
            check: e2e
          - name: S3 Test
            check: s3
          - name: Netrc Test
            check: netrc
          - name: Socket Activation Test
            check: socket-activation
          - name: Multi-Instance Test
            check: multi-instance
          - name: Public Keys Test
            check: public-keys
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      timeout-minutes: 45
      flake-check: false
      build: true
      build-command: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
      cache: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        Cargo.lock
        Cargo.toml
        crates/**
        ncro/**

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
