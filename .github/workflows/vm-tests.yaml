name: NixOS VM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            files:
              - '.github/workflows/vm-tests.yaml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'ncro/**'
              - 'nix/package.nix'
              - 'nix/module.nix'
              - 'nix/tests/**'
              - 'flake.nix'
              - 'flake.lock'

  vm-test:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: P2P Discovery Test
            check: p2p-discovery
          - name: E2E Test
            check: e2e
          - name: S3 Test
            check: s3
          - name: Netrc Test
            check: netrc
          - name: Socket Activation Test
            check: socket-activation
          - name: Multi-Instance Test
            check: multi-instance
          - name: Public Keys Test
            check: public-keys
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - run: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
