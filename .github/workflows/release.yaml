name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Format, Lint and Test"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@560a17ad36b7a4045622698befdc13dc17ca243f # v1.0.0
    with:
      stage: prepare
      # The reusable workflow expands this unquoted, so shell quotes would reach fq literally.
      version-command: nix run nixpkgs#fq -- -r .workspace.package.version Cargo.toml

  build:
    name: Build ncro (${{ matrix.suffix }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@560a17ad36b7a4045622698befdc13dc17ca243f # v1.0.0
    with:
      upload: true
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      build-command: nix build .#ncro -L
      binary-name: ncro
      asset-prefix: ncro
      suffix: ${{ matrix.suffix }}

  finalize:
    name: Finalize Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@560a17ad36b7a4045622698befdc13dc17ca243f # v1.0.0
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}
      asset-prefix: ncro
