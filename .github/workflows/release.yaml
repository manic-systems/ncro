name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      stage: prepare

  build:
    name: Build ncro (${{ matrix.suffix }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: ubuntu-26.04-arm
            suffix: linux-arm64
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      upload: true
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      build-command: nix build .#ncro -L
      binary-name: ncro
      asset-prefix: ncro
      suffix: ${{ matrix.suffix }}

  finalize:
    name: Finalize Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@b22b11dd6ae5da25aa9c82fcba380b05003af2dd # v2.1.2
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}
      asset-prefix: ncro
