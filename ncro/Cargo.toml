[package]
name                  = "ncro"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
description.workspace = true
homepage.workspace    = true
repository.workspace  = true
readme.workspace      = true

[dependencies]
axum.workspace          = true
caress.workspace        = true
data-encoding.workspace = true
flub.workspace          = true
libc.workspace          = true
misstep                 = { workspace = true, features = [ "color", "location", "panic-hook" ] }
pound.workspace         = true
socket2.workspace       = true
tokio                   = { workspace = true, features = [ "macros", "rt-multi-thread", "signal", "time", "net", "fs" ] }
tracing.workspace       = true
tracing-subscriber      = { workspace = true, features = [ "ansi", "fmt", "json", "smallvec", "tracing-log" ] }

ncro-config.workspace    = true
ncro-db.workspace        = true
ncro-discovery.workspace = true
ncro-health.workspace    = true
ncro-mesh.workspace      = true
ncro-metrics.workspace   = true
ncro-narinfo.workspace   = true
ncro-router.workspace    = true
ncro-server.workspace    = true
ncro-upstream.workspace  = true

[lints]
workspace = true
